repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.1
    hooks:
      - id: mypy
        # Match python version and point to the config file
        args: [--config-file=pyproject.toml]
        # Include type stubs if needed, otherwise ignore-missing-imports handles it
        additional_dependencies: []

  - repo: local
    hooks:
      - id: check-branch-name
        name: Check Branch Name
        entry: python scripts/check_branch_name.py
        language: python
        pass_filenames: false
        always_run: true

      - id: check-commit-msg
        name: Check Commit Message
        entry: python scripts/check_commit_msg.py
        language: python
        stages: [commit-msg]
