[project]
name = "school-timetabling-problem-solver"
version = "0.1.0"
description = "LLM-Driven Reinforcement Learning Hyper-Heuristic for the School Timetabling Problem"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "snakemake>=9.23.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "pre-commit>=3.7.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --tb=short --cov=solver --cov-report=term-missing"
testpaths = [
    "tests",
]
pythonpath = [
    "src",
    ".",
]
markers = [
    "slow: long-running DoD acceptance tests (deselect with -m 'not slow')",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort (import sorting)
    "B",     # flake8-bugbear (common bugs)
    "C90",   # mccabe (code complexity)
    "UP",    # pyupgrade (modern python syntax)
    "RUF",   # ruff-specific rules
    "ANN",   # flake8-annotations (type hints coverage)
]
ignore = []

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
pretty = true
show_error_codes = true
