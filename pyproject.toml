[project]
name = "school-timetabling-problem-solver"
version = "0.1.0"
description = "LLM-Driven Reinforcement Learning for ITC2019 School Timetabling Problem"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.144.0",
    "httpx>=0.27",
    "lxml>=5.2",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "python-multipart>=0.0.32",
    "scipy>=1.18.1",
    "snakemake>=9.23.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "pre-commit>=4.0.0",
    "dvc>=3.59.0",
    "lxml-stubs>=0.5.1",
    "types-requests>=2.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
